[package]
name = "reticulum-mesh-sim"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
default-run = "reticulum-mesh-sim"

description = "Host-side large-scale mesh simulator for reticulum-rs embedded/Embassy transport behavior."

[dependencies]
embassy-executor = { version = "0.7", features = [
    "arch-std",
    "executor-thread",
] }
embassy-time = { version = "0.4", features = ["std"] }
reticulum = { path = "..", default-features = false, features = ["embassy-virtual-mt"] }

[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "mesh_stress"
harness = false
